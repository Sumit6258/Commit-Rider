[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-rider"
version = "1.0.0"
description = "Turn your GitHub contribution history into an animated bicycle ride over contribution terrain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sumit6258" }]
keywords = ["github", "contributions", "profile-readme", "animation", "gif", "github-actions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.1,<14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "PyYAML>=6"]

[project.scripts]
commit-rider = "commit_rider.cli:main"

[project.urls]
Homepage = "https://github.com/Sumit6258/commit-rider"
Issues = "https://github.com/Sumit6258/commit-rider/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["commit_rider"]
branch = false
